[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vortex-api"
version = "0.2.1"
description = "Vortex API: self-hosted, OpenAI-compatible model gateway and product API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "psutil>=5.9",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pillow>=10.0",
  "trafilatura>=1.8",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
# OCR for images and scanned PDFs (runs offline on CPU)
ocr = ["rapidocr-onnxruntime>=1.2", "pypdfium2>=4.20"]
# Serve the from-scratch Vortex GPT (vortex/ package at the repo root)
native = ["torch>=2.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["vortex_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
