# Axolotl QLoRA recipe for Vortex.
#   axolotl train models/finetune/axolotl/vortex-qlora.yaml
base_model: Qwen/Qwen2.5-7B-Instruct
load_in_4bit: true
adapter: qlora
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_linear: true

chat_template: qwen_25
datasets:
  - path: models/finetune/data/vortex_identity.sample.jsonl
    type: chat_template
    field_messages: messages
    roles_to_train: [assistant]

sequence_len: 4096
sample_packing: true
pad_to_sequence_len: true

micro_batch_size: 2
gradient_accumulation_steps: 8
num_epochs: 2
learning_rate: 0.0002
lr_scheduler: cosine
warmup_ratio: 0.03
optimizer: adamw_bnb_8bit
bf16: auto
gradient_checkpointing: true
flash_attention: true

output_dir: ./out/vortex-v0.3-axolotl
save_strategy: epoch
logging_steps: 10
use_wandb: false
