# SearXNG settings for Vortex: private metasearch the API can query as JSON.
use_default_settings: true

general:
  instance_name: "Vortex Pesquisa"

server:
  # Overridden by the SEARXNG_SECRET environment variable.
  secret_key: "troque-este-segredo"
  limiter: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 1
  default_lang: "pt-BR"
  autocomplete: ""
  formats:
    - html
    - json
